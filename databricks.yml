# CAOS as a Databricks App, declared as an asset bundle (spec section 4, D23).
#
# Nothing workspace-specific is written here: every value an enterprise
# deployment differs on is a variable, and the workspace host comes from the
# CLI profile (`databricks bundle validate -t prod -p <profile>`). See
# docs/DEPLOYMENT.md for the resources the workspace must hold first.
bundle:
  name: caos
  # The direct engine and the fields below exist from this CLI on (N5).
  databricks_cli_version: ">= 1.17.0"

variables:
  model_endpoint:
    description: The AI Gateway serving endpoint every production model call goes through.
    default: databricks-claude-opus-5
  model_price:
    description: >-
      The dated per-token price for exactly that endpoint, as
      endpoint,input_per_token,output_per_token,YYYY-MM-DD (budgets fail closed on it).
    default: databricks-claude-opus-5,0.000005,0.000025,2026-09-22
  model_choices:
    description: >-
      The other approved endpoints a run may be started on (F468), each as a
      dated price in model_price's form, joined by ';'; empty, model_endpoint
      is the only one. The bundle grants CAN_QUERY on model_endpoint alone: a
      workspace administrator grants it on each of these to the app's service
      principal (docs/DEPLOYMENT.md section 1).
    default: ""
  uc_catalog:
    description: The Unity Catalog catalog holding the caos schema and its blob volume.
  uc_schema:
    description: The schema under that catalog (the volume is <catalog>.<schema>.caos_blobs).
  # The store and the graph checkpoints live in Lakebase, bound by the target
  # (see targets): Autoscaling by default, an existing Provisioned instance
  # in the -provisioned pair. Each target requires its own kind's names and
  # leaves the other kind's unbound.
  lakebase_project:
    description: >-
      The Lakebase Autoscaling project, by its id (projects/<id>), that holds
      the store and the graph checkpoints: the default kind, bound by dev and prod.
  lakebase_branch:
    description: The branch of that project the app binds.
    default: production
  lakebase_endpoint:
    description: The read-write endpoint on that branch, by its id; the app mints its credential for it.
    default: primary
  lakebase_database_id:
    description: >-
      The database on that branch, by its resource id
      (`databricks postgres list-databases projects/<project>/branches/<branch>`).
    default: databricks-postgres
  lakebase_instance:
    description: >-
      An existing Lakebase Provisioned instance's name, bound only by
      dev-provisioned and prod-provisioned (no new Provisioned instance can be
      created since 12 March 2026).
  lakebase_database:
    description: The database on that Provisioned instance.
    default: databricks_postgres
  run_ceiling:
    description: >-
      What one run may spend at the endpoint's price, as a decimal amount; it
      must cover at least one worst-case call (scripts/preflight.py checks).
      The default is the widest profile at its section bounds plus one
      worst-case call at the default price (D29); evidence is on top of it.
    default: "120.00"
  group_admin:
    description: The workspace group whose members are ADMIN.
    default: caos-admins
  group_analyst:
    description: The workspace group whose members are ANALYST.
    default: caos-analysts

resources:
  apps:
    caos:
      # `caos` is the production app and only `prod` says so; any other
      # target, one added later included, gets a name of its own (DP-6, DF-5).
      name: caos-${bundle.target}
      description: Governed source documents to committee-ready credit conclusions.
      source_code_path: ./
      # The caller's own token reaches the app (D10); SCIM Me names the caller.
      forward_user_access_token: true
      user_api_scopes:
        - iam.current-user:read
      config:
        # The lock, and only the runtime groups: the dev toolchain never
        # installs into the app (F49).
        command: ["uv", "run", "--locked", "--no-dev", "python", "-m", "caos.serve"]
        env:
          - name: CAOS_BIND_HOST
            value: "0.0.0.0"
          - name: CAOS_WORKER_IN_PROCESS
            value: "1"
          - name: CAOS_SITE_ROOT
            value: "frontend/dist"
          - name: CAOS_MODEL_ENDPOINT
            value: ${var.model_endpoint}
          - name: CAOS_MODEL_PRICE
            value: ${var.model_price}
          # The configured price first: an empty variable resolves to an
          # entry with no value at all, which E2 and the platform would read
          # as missing (D75).
          - name: CAOS_MODEL_CHOICES
            value: ${var.model_price};${var.model_choices}
          - name: CAOS_RUN_CEILING
            value: ${var.run_ceiling}
          - name: CAOS_BLOB_ROOT
            value: volume:///Volumes/${var.uc_catalog}/${var.uc_schema}/caos_blobs
          - name: CAOS_GROUP_ADMIN
            value: ${var.group_admin}
          - name: CAOS_GROUP_ANALYST
            value: ${var.group_analyst}
      # Who may open the app (F50): the proxy stops anyone without CAN_USE
      # before the API sees them, whatever group standing they hold. Neither
      # business group may manage the app (W3): CAN_MANAGE deploys code as
      # the app's principal, which writes the ledger; the deployer holds it.
      permissions:
        - group_name: ${var.group_admin}
          level: CAN_USE
        - group_name: ${var.group_analyst}
          level: CAN_USE
      resources:
        - name: model
          description: The gateway endpoint the model factory calls.
          serving_endpoint:
            name: ${var.model_endpoint}
            permission: CAN_QUERY
        - name: blobs
          description: Content-addressed sources and artifacts.
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.uc_catalog}.${var.uc_schema}.caos_blobs
            permission: WRITE_VOLUME

sync:
  # An allowlist of what the process reads, so nothing else in a working tree
  # ever ships: the package, the agent definitions, the bundle authority, the
  # static export (built locally, git-ignored) and the lock. A denylist dropped
  # `caos/qualification` because the CLI matches `dir/**` at every depth (C2),
  # and it uploaded untracked files such as a local blob cache (TM-3).
  paths:
    - caos
    - icm
    - vendor
    - frontend/dist
    - app.yaml
    - pyproject.toml
    - uv.lock
    - .python-version
  # The export is git-ignored, and the sync honours the ignore file, so it
  # is named again here or it does not ship.
  include:
    - frontend/dist/**

targets:
  # Which Lakebase the app binds is the target's to say, and each target
  # says it once: the `database` resource in its form and the one variable
  # the process mints its credential for (CAOS_LAKEBASE_ENDPOINT or
  # CAOS_LAKEBASE_INSTANCE, never both). A variable cannot choose between the
  # `postgres` and `database` resource forms (N45), so the kinds are target
  # pairs: dev and prod bind Lakebase Autoscaling, the default;
  # dev-provisioned and prod-provisioned bind an existing Provisioned
  # instance. Moving a deployed app from one kind to the other changes the
  # Postgres role it connects as (docs/DEPLOYMENT.md section 7).
  dev:
    mode: development
    default: true
    variables:
      lakebase_instance: unbound  # the -provisioned targets' own
    # Each developer's copy is their own app (DP-6, DF-5): development mode
    # gives each a bundle root of their own but leaves app names alone, and
    # an app name is unique in the workspace. The numeric user id keeps to
    # the Apps name rule (lowercase letters, digits and hyphens).
    resources:
      apps:
        caos:
          name: caos-${bundle.target}-${workspace.current_user.id}
          config:
            env:
              - name: CAOS_LAKEBASE_ENDPOINT
                value: projects/${var.lakebase_project}/branches/${var.lakebase_branch}/endpoints/${var.lakebase_endpoint}
          resources:
            - name: database
              description: The store and the LangGraph checkpoint schema.
              postgres:
                branch: projects/${var.lakebase_project}/branches/${var.lakebase_branch}
                database: projects/${var.lakebase_project}/branches/${var.lakebase_branch}/databases/${var.lakebase_database_id}
                permission: CAN_CONNECT_AND_CREATE
  prod:
    mode: production
    variables:
      lakebase_instance: unbound  # the -provisioned targets' own
    resources:
      apps:
        caos:
          name: caos
          config:
            env:
              - name: CAOS_LAKEBASE_ENDPOINT
                value: projects/${var.lakebase_project}/branches/${var.lakebase_branch}/endpoints/${var.lakebase_endpoint}
          resources:
            - name: database
              description: The store and the LangGraph checkpoint schema.
              postgres:
                branch: projects/${var.lakebase_project}/branches/${var.lakebase_branch}
                database: projects/${var.lakebase_project}/branches/${var.lakebase_branch}/databases/${var.lakebase_database_id}
                permission: CAN_CONNECT_AND_CREATE
    # One copy, in a path of its own rather than the deployer's home or the
    # world-writable Shared folder (F51); the deployer creates it.
    workspace:
      root_path: /Workspace/caos-bundle/${bundle.target}
  dev-provisioned:
    mode: development
    variables:
      lakebase_project: unbound  # the Autoscaling targets' own
    resources:
      apps:
        caos:
          # Shorter than caos-${bundle.target}-<id>: an app name is at most
          # 30 characters, and a user id can take 16 of them.
          name: caos-devprov-${workspace.current_user.id}
          config:
            env:
              - name: CAOS_LAKEBASE_INSTANCE
                value: ${var.lakebase_instance}
          resources:
            - name: database
              description: The store and the LangGraph checkpoint schema.
              database:
                instance_name: ${var.lakebase_instance}
                database_name: ${var.lakebase_database}
                permission: CAN_CONNECT_AND_CREATE
  prod-provisioned:
    mode: production
    variables:
      lakebase_project: unbound  # the Autoscaling targets' own
    resources:
      apps:
        caos:
          # The production app, as in prod: a deploy of one kind over an app
          # the other kind's state holds is refused as a taken name (DP-6)
          # rather than rebinding the app's role (section 7).
          name: caos
          config:
            env:
              - name: CAOS_LAKEBASE_INSTANCE
                value: ${var.lakebase_instance}
          resources:
            - name: database
              description: The store and the LangGraph checkpoint schema.
              database:
                instance_name: ${var.lakebase_instance}
                database_name: ${var.lakebase_database}
                permission: CAN_CONNECT_AND_CREATE
    workspace:
      root_path: /Workspace/caos-bundle/${bundle.target}
