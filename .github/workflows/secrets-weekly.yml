# Weekly full-history secret scan (N6 backstop). Copy to
# .github/workflows/secrets-weekly.yml next to gitleaks.yml, which it calls.
# Only this file is exposed to GitHub's 60-day inactivity auto-disable of
# scheduled workflows in public repos (W2); the push/PR scan in gitleaks.yml
# has no schedule and is unaffected. Re-enable it in the Actions tab if it
# is disabled. Making `secrets` a required check is an owner GitHub setting.
name: secrets-weekly

on:
  schedule:
    - cron: '17 3 * * 1'        # Monday 03:17 UTC
  workflow_dispatch:            # manual full-history scan

permissions:
  contents: read

jobs:
  weekly:
    permissions:
      contents: read
    # The called workflow sees this event name (schedule / workflow_dispatch)
    # and scans the full history of every fetched ref.
    uses: ./.github/workflows/gitleaks.yml
