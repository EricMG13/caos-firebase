timeout: 1800s
steps:
  - name: gcr.io/cloud-builders/docker@sha256:f772ab459889c67835bd959c2b9e9351f2c0752c4f989710ecda20c229f0733e
    args: ["build", "-t", "${_IMAGE}",
           "--build-arg", "VITE_FIREBASE_API_KEY=${_FIREBASE_API_KEY}",
           "--build-arg", "VITE_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}",
           "--build-arg", "VITE_FIREBASE_PROJECT_ID=${PROJECT_ID}", "."]
images: ["${_IMAGE}"]
serviceAccount: projects/$PROJECT_ID/serviceAccounts/caos-build@$PROJECT_ID.iam.gserviceaccount.com
options:
  requestedVerifyOption: VERIFIED
  logging: CLOUD_LOGGING_ONLY
